name: Java build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: worldtemps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Smoke test bundled sample
        run: printf '1\n2\n0\n' | java -jar target/worldtemps.jar
      - name: Install virtual display for desktop tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6
      - name: Exercise JavaFX dashboard
        run: xvfb-run -a mvn --batch-mode --no-transfer-progress -Pui-tests clean verify
      - name: Upload dashboard preview
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: target/ui/*.png
  desktop-packages:
    name: Desktop package (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify bundled-runtime and portable packages
        run: python scripts/package_desktop.py
      - name: Upload platform packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: worldtemps-${{ runner.os }}-${{ runner.arch }}
          retention-days: 7
          path: |
            target/releases/*.zip
            target/releases/SHA256SUMS-*.txt
  draft-release:
    name: Prepare versioned draft release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: worldtemps-*
          merge-multiple: true
          path: target/release-assets
      - name: Create draft only when this version has no release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --draft --title "WorldTemps $version" --notes-file docs/release-notes.md target/release-assets/*.zip target/release-assets/SHA256SUMS-*.txt
